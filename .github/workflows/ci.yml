name: governed-paper-trading-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: investment
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: investment_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U investment -d investment_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: postgresql+asyncpg://investment:test-password@127.0.0.1:5432/investment_test
      JWT_EXPIRE_MINUTES: "30"
      CORS_ORIGINS: https://console.example.test
      MARKET_DATA_ALLOWED_HOSTS: licensed.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate ephemeral test key
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: python -m compileall -q backend tests
      - run: python -m backend.scripts.migrate && python -m backend.scripts.migrate
      - name: Governed unit and PostgreSQL workflow tests
        env:
          ENVIRONMENT: production
          RUN_DATABASE_TESTS: "1"
        run: pytest -q tests/test_governed_trading.py
      - name: Supported API boundary and runtime guard tests
        env:
          ENVIRONMENT: development
        run: pytest -q tests/test_api.py
      - run: pip-audit
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web audit --omit=dev --audit-level=low
      - name: Build unprivileged images
        run: |
          docker build --target api -t investment-api:${{ github.sha }} .
          docker build --target web -t investment-web:${{ github.sha }} .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
